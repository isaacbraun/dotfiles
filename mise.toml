[settings]
experimental = true
dotfiles.default_mode = "symlink"
idiomatic_version_file_enable_tools = ["pnpm"]

[tools]
bat = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
"github:agavra/tuicr" = "latest"
go = "latest"
herdr = "latest"
lazygit = "latest"
neovim = "latest"
node = "latest"
pnpm = "latest"
python = "3"
ripgrep = "latest"
rust = "latest"
zoxide = "latest"

## Need to add and setup GitHub CLI etc.
# gh = "latest"
# git-delta = "latest"
# git-lfs = "latest"

[bootstrap.repos]
"~/.config/nvim" = { url = "git@github.com:isaacbraun/nvim.git" }

[dotfiles]
"~/.gitconfig" = "gitconfig"
"~/.githelpers" = "githelpers"
"~/.gitignore" = "gitignore"
"~/.gitconfig-enterprise" = "gitconfig-enterprise"
"~/.git-completion.bash" = "git-completion/git-completion.bash"
"~/.zsh/_git" = "git-completion/git-completion.zsh"
"~/.zshrc" = "zshrc"
"~/scripts" = "scripts"
"~/.config/ghostty/config" = "ghostty_config"
"~/.config/zed/settings.json" = "zed_settings.json"
"~/.config/zed/keymap.json" = "zed_keymap.json"
"~/.config/lazygit/config.yml" = "lazygit.yml"
"~/.config/mise/config.toml" = "mise.toml"
"~/.config/herdr/config.toml" = "herdr.toml"
"~/.config/herdr/plugins/config/aarsh21.tab-title/config.toml" = "herdr-tab-title.toml"
"~/.config/herdr/plugins/config/pickr/config.toml" = "herdr-pickr.toml"
"~/.config/herdr/plugins/config/spotify-now-playing/config.toml" = "herdr-spotify.toml"
"~/.config/opencode/opencode.json" = "opencode.jsonc"
"~/.config/tuicr/config.toml" = "tuicr.toml"

[tasks.link]
description = "Apply dotfile symlinks"
run = "mise dotfiles apply --yes"

[tasks.scripts]
description = "Make scripts executable"
run = "chmod +x scripts/*"

[tasks.obsidian]
description = "Link Obsidian vimrc"
run = '''
if [ -d "$HOME/notes" ]; then
  ln -sf "$MISE_PROJECT_ROOT/obsidian.vimrc" "$HOME/notes/.obsidian.vimrc"
  echo "Linked Obsidian vimrc to $HOME/notes/.obsidian.vimrc"
else
  mkdir -p "$HOME/obsidian/bauen"
  ln -sf "$MISE_PROJECT_ROOT/obsidian.vimrc" "$HOME/obsidian/bauen/.obsidian.vimrc"
  echo "Linked Obsidian vimrc to $HOME/obsidian/bauen/.obsidian.vimrc"
fi
'''

[tasks.herdr]
description = "Run herdr setup"
run = [
  "herdr integration install opencode",
  "herdr integration install copilot",
  "herdr plugin install aarsh21/herdr-tab-title -y",
  "herdr plugin action invoke aarsh21.tab-title.start",
  "herdr plugin install salkhalil/herdr-sessionizer -y",
  "herdr plugin install iikjl/herdr-spotify -y",
  "herdr plugin install tomasvarga/herdr-pickr -y",
  "npx skills add ogulcancelik/herdr --skill herdr -g",
]

[bootstrap.packages]
"brew:tree-sitter-cli" = "latest"

[bootstrap.hooks.final]
run = [
  "mise run scripts",
  "mise run obsidian",
  "mise run herdr",
]
