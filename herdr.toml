onboarding = false
[keys]
prefix = "ctrl+a"
goto = "ctrl+b"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "spotify-now-playing.open"
description = "Spotify now playing"

[theme]
name = "catppuccin-latte"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "gruvbox-dark-hard"

[ui]
prompt_new_tab_name = false
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false

[experimental]
kitty_graphics = true
